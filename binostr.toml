# Binostr Configuration
#
# Control which serialization formats are included in benchmarks and comparisons.
# Set a format to `false` to exclude it from analysis (the code remains for
# historical purposes, but it won't run in benchmarks or appear in reports).

[formats]
# JSON - baseline format, always included for comparison
json = true

# CBOR variants
cbor_schemaless = false  # Basic CBOR with string keys
cbor_packed = true       # CBOR with packed field indices
cbor_intkey = false      # CBOR with integer keys

# MessagePack - open standard, compact array representation
msgpack = true

# Open, schema-defined interoperability candidates
flatbuffers = true
flexbuffers = true       # Official schema-less FlatBuffers companion
avro = true             # Raw Avro binary datum; schema is supplied out of band
bson = true
thrift_compact = true

# Emerging open-format performance reference (not a broad-language SDK candidate)
beve = true

# Rust-only ecosystem references (measured, but not SDK wire-format candidates)
bincode = true
postcard = true

# Protocol Buffers variants
proto_string = false     # Protobuf with hex string fields
proto_binary = true      # Protobuf with binary fields and reversible tag values

# Cap'n Proto variants
capnp = false            # Cap'n Proto standard
capnp_packed = true     # Cap'n Proto packed encoding

# Custom formats
dannypack = true         # Custom compact format (experimental reference)
notepack = true          # Custom Nostr-specific reference format
