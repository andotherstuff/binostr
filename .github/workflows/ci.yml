name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install schema compilers
        run: sudo apt-get update && sudo apt-get install -y capnproto protobuf-compiler flatbuffers-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: python3 -m py_compile scripts/*.py
      - name: Regenerate deterministic vectors
        run: cargo run --release --example generate_vectors
      - run: git diff --exit-code -- vectors/interop-v1.json
      - name: Regenerate tracked Criterion repeatability summary
        run: python3 scripts/record_criterion_run.py aggregate m4max-2026-08-21
      - run: git diff --exit-code -- results/criterion-repeatability.json results/criterion-repeatability.md

  python-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install schema compilers
        run: sudo apt-get update && sudo apt-get install -y capnproto libcapnp-dev protobuf-compiler flatbuffers-compiler
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/interop-requirements.txt
      - run: pip install -r scripts/interop-requirements.txt
      - run: python scripts/verify_python_interop.py
